services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=reviewiq-super-secret-jwt-key-2026-production
      - DATABASE_URL=sqlite:///./reviewiq.db
      - ENVIRONMENT=production
    volumes:
      - ./backend/reviewiq.db:/app/reviewiq.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
